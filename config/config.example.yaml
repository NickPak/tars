llm:
  active: gemini/gemini-3.1-flash-lite
  providers:
    - id: gemini
      type: gemini
      apiKey: ${LLM_API_KEY}
      timeout: 60s
  models:
    - id: gemini/gemini-3.1-flash-lite
      provider: gemini
      modelId: gemini-3.1-flash-lite
      contextWindow: 1048576
      inputPricePerMillion: 0.075
      outputPricePerMillion: 0.30
      # thinkingBudget：-1 动态思考 / 0 关闭 / >0 固定预算（flash-lite 默认 0，需显式开启）
      thinkingBudget: -1

# 工作目录（agent 工具操作 + 会话数据存储的根目录）
# 留空则默认为用户家目录下的 tars 目录（~/tars）
# workDir: "~/tars"

# Agent 配置
agent:
  # ReAct 循环最大迭代轮次（LLM→工具→LLM 一轮算一次）
  # 防止模型陷入死循环烧 token；复杂的多文件任务需要较大预算
  # 未配置时默认 200
  maxIterations: 200

  # 上下文压缩阈值（0-1）：使用占比超过该值时应触发历史压缩（功能待实现，先在状态栏展示）
  compressionThreshold: 0.8

# 追踪配置（OpenTelemetry）：仅导出到 OTLP 收集器，不写本地文件
trace:
  # 总开关：缺省/false = 停用（即使配置了端点也不产生 span）
  # enabled: true
  # OTLP/HTTP 导出（Jaeger 等）：docker run -d -p 16686:16686 -p 4318:4318 jaegertracing/all-in-one
  # otlpHttpEndpoint: "localhost:4318"
  # OTLP/gRPC 导出（Arize Phoenix 等 LLM 专属视图）：docker run -d -p 6006:6006 -p 4317:4317 arizephoenix/phoenix
  # otlpGrpcEndpoint: "localhost:4317"
