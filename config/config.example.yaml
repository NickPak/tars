llm:
  active: gemini/gemini-3.1-flash-lite
  providers:
    - id: gemini
      type: gemini
      apiKey: ${LLM_API_KEY}
      timeout: 60s
  models:
    - id: gemini/gemini-3.1-flash-lite
      provider: gemini
      modelId: gemini-3.1-flash-lite
      contextWindow: 1048576
      inputPricePerMillion: 0.075
      outputPricePerMillion: 0.30
      # thinkingBudget：-1 动态思考 / 0 关闭 / >0 固定预算（flash-lite 默认 0，需显式开启）
      thinkingBudget: -1

# 工作目录（agent 工具操作 + 会话数据存储的根目录）
# 留空则默认为用户家目录下的 tars 目录（~/tars）
# workDir: "~/tars"

# Agent 配置
agent:
  # ReAct 循环最大迭代轮次（LLM→工具→LLM 一轮算一次）
  # 防止模型陷入死循环烧 token；复杂的多文件任务需要较大预算
  # 未配置时默认 200
  maxIterations: 200

  # 上下文压缩阈值（0-1）：使用占比超过该值时应触发历史压缩（功能待实现，先在状态栏展示）
  compressionThreshold: 0.8

# Skills 配置（技能安装于 <workDir>/skills/，索引档位说明见设计文档 2.5）
# skills:
#   tierFullMax: 50       # ≤此数量时全部条目常驻系统消息
#   tierResidentMax: 500  # 超过则只留"用 discover_tools 检索"提示
#   discoverResultLimit: 5 # 模糊检索候选数上限：discover_tools 与设置页搜索共用

# MCP 服务器配置（外部工具供给渠道，全部可选）
# 设计要点（plan 3.6）：服务器默认关闭（enabled 缺省 false，显式启用）；
# 会话启动不拉起进程——discover_tools 命中后才懒启动；名字会编入工具名
# mcp__<server>__<tool>，须为小写字母/数字/连字符。
# mcp:
#   servers:
#     yahoo-finance:                  # 服务器名（编入工具名）
#       command: npx                  # 可执行文件或启动器（npx/uvx/…）
#       args: ["-y", "yahoo-finance-mcp"]
#       env:                          # 最小权限凭证；支持 ${VAR} 引用
#         API_KEY: ${YF_API_KEY}
#       description: "stock quotes and financial data"  # 一句话能力描述（模型可见，用英文）
#       sourceType: query             # 信息源类型：search/read/parse/query
#       enabled: false                # 默认关闭，显式启用
#       risk: medium                  # 工具默认风险级别：low/medium/high（默认 medium，走审批）

# 追踪配置（OpenTelemetry）：仅导出到 OTLP 收集器，不写本地文件
trace:
  # 总开关：缺省/false = 停用（即使配置了端点也不产生 span）
  # enabled: true
  # OTLP/HTTP 导出（Jaeger 等）：docker run -d -p 16686:16686 -p 4318:4318 jaegertracing/all-in-one
  # otlpHttpEndpoint: "localhost:4318"
  # OTLP/gRPC 导出（Arize Phoenix 等 LLM 专属视图）：docker run -d -p 6006:6006 -p 4317:4317 arizephoenix/phoenix
  # otlpGrpcEndpoint: "localhost:4317"
